---
cw_namespace: CWAgent
cw_metric_collection_interval_seconds: 60
linux_disk_metric_name: disk_used_percent
windows_disk_metric_name: disk_free_percent

disk_warning_threshold: 80
disk_critical_threshold: 90
alarm_period_seconds: 60
alarm_evaluation_periods: 3
alarm_datapoints_to_alarm: 3

coverage_max_age_minutes: 5
coverage_inventory_max_age_minutes: 30
enrollment_grace_minutes: 15

# These filesystems do not represent persistent disk capacity.
linux_ignored_filesystems:
  - sysfs
  - devtmpfs
  - tmpfs
  - ramfs
  - squashfs
  - overlay
  - proc
  - cgroup
  - cgroup2
  - debugfs
  - tracefs
  - securityfs
  - pstore
  - configfs
  - fusectl
  - mqueue
  - hugetlbfs
  - devpts
  - autofs
